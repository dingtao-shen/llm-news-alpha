# 所有数据路径集中在这里；代码只读这个文件，不写死路径。
workspace: /workspace
logs: /workspace/logs
mlruns: /workspace/mlruns

raw:
  fnspid_news: /workspace/data/raw/fnspid      # nasdaq_exteral_data.csv, All_external.csv
  prices_csv: /workspace/data/prices           # yfinance 日频 CSV 缓存
  universe: /workspace/data/raw/universe       # 时点成分股表

qlib_dir: /workspace/qlib_data/us_sp500

news:
  parquet_dir: /workspace/data/news/fnspid_parquet   # 模块 2 任务 1：原始 CSV 的全字符串 parquet（<source>/part-*.parquet）
  clean: /workspace/data/news/news_clean.parquet   # 接口文件 1
  panel: /workspace/data/news/news_panel.parquet

emb_dir: /workspace/data/emb                   # 接口文件 2：按 news_id 分片的 float16 嵌入
pred_dir: /workspace/data/preds                # 接口文件 3：pred.parquet（datetime × instrument × score）
suffstats_dir: /workspace/data/suffstats
pca_dir: /workspace/data/pca

results: results                               # 仓库内，小文件进 git
dev_sample: dev_data                           # 仅 Mac：开发样本，不进 git

models:
  llama3_base: meta-llama/Meta-Llama-3-8B
  llama3_instruct: meta-llama/Meta-Llama-3-8B-Instruct
  finbert: yiyanghkust/finbert-pretrain
  minilm: sentence-transformers/all-MiniLM-L6-v2
  chronobert_prefix: manelalab/chrono-bert-v1-   # + YYYYMMDD
